<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>all bookings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand">trekking management app</a>
        <div>
            <a href="/admin/dashboard" class="btn btn-outline-light btn-sm me-2">dashboard</a>
            <a href="/logout" class="btn btn-danger btn-sm">logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h3>all bookings</h3>
    <table class="table table-bordered table-striped mt-3">
        <thead class="table-dark">
            <tr>
                <th>id</th>
                <th>user</th>
                <th>trek</th>
                <th>booking date</th>
                <th>status</th>
            </tr>
        </thead>
        <tbody>
            {% for booking in bookings %}
            <tr>
                <td>{{ booking.id }}</td>
                <td>{{ booking.user.name }}</td>
                <td>{{ booking.trek.name }}</td>
                <td>{{ booking.booking_date.strftime('%d/%m/%Y') }}</td>
                <td>{{ booking.status }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="5" class="text-center">no bookings yet</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
